name: Build kernel and push to Cachix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # One entry per kernel in pkgs/kernel/default.nix; the flake exposes
        # each of them as .#nabu-kernel-<name>.
        kernel: [sm8150-fork, mainline-latest]
    env:
      CACHIX_CACHE_NAME: nix-nabu
      KERNEL: ${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Free space on the hosted runner
        # `mainline-latest` builds nixpkgs' full module set; the arm64 runners
        # have little room to spare out of the box.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Check Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::Set the repository secret CACHIX_AUTH_TOKEN to a token with write access to nix-nabu.'
            exit 1
          fi

      - uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-nabu.cachix.org
            extra-trusted-public-keys = nix-nabu.cachix.org-1:6oBp/ANDnp5za8MMMfz6EpkJbN1jaRlRpPIoKL4tCGM=
            max-jobs = 1
            cores = 4

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push explicitly below: include cache hits and surface upload failures.
          skipPush: true

      - name: Build native ARM64 kernel (${{ matrix.kernel }})
        run: |
          # `^*` asks for every output of the kernel derivation (out, dev,
          # modules, ...).  A NixOS system only depends on `out`, so building
          # and pushing that alone leaves `-modules`/`-dev` to be rebuilt on
          # every machine that consumes this cache.
          nix build ".#nabu-kernel-$KERNEL^*" \
            --no-update-lock-file --print-build-logs --out-link result-kernel

      - name: Push kernel outputs to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          drv=$(nix path-info --derivation ".#nabu-kernel-$KERNEL")
          mapfile -t paths < <(nix-store -q --outputs "$drv" | sort -u)
          # The kconfig derivation is per-kernel and custom: it is not in
          # cache.nixos.org and it is not an input of any kernel output, so it
          # has to be pushed explicitly or a consumer rebuilds the config.
          paths+=("$(nix build --no-link --print-out-paths ".#nabu-kernel-$KERNEL.configfile")")
          for path in "${paths[@]}"; do
            echo "pushing $path"
            cachix push "$CACHIX_CACHE_NAME" "$path"
          done
          {
            echo "### Kernel cached: $KERNEL"
            echo "Commit: $GITHUB_SHA"
            echo "Kernel: $KERNEL"
            echo 'Store paths:'
            printf -- '- `%s`\n' "${paths[@]}"
            echo "Cache: https://$CACHIX_CACHE_NAME.cachix.org"
          } >> "$GITHUB_STEP_SUMMARY"
